<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello OpenShift</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #151515; color: #fff; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    main { background: #212427; border-top: 4px solid #ee0000; padding: 2rem 2.5rem; border-radius: 6px; min-width: 320px; }
    h1 { margin-top: 0; }
    dt { color: #a3a3a3; margin-top: .75rem; }
    dd { margin: 0; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from OpenShift 🚀</h1>
    <dl id="info"><dt>Loading...</dt></dl>
  </main>
  <script>
    fetch("/api/info")
      .then((r) => r.json())
      .then((d) => {
        const rows = [
          ["Version", d.version],
          ["Pod", d.pod],
          ["Running as UID", d.uid],
          ["APP_MESSAGE", d.message],
          ["APP_SECRET set", d.secretPresent ? "yes" : "no"],
        ];
        document.getElementById("info").innerHTML = rows
          .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`)
          .join("");
      })
      .catch(() => (document.getElementById("info").textContent = "Could not load /api/info"));
  </script>
</body>
</html>
