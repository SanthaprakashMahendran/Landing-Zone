apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Secrets are intentionally NOT listed here - never commit real secrets to Git.
# Create them separately:  oc create secret generic landing-secret --from-literal=APP_SECRET=...
resources:
  - imagestream.yaml
  - buildconfig.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml