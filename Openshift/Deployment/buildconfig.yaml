apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: landing-app
  labels:
    app: landing-app
spec:
  source:
    type: Git
    git:
      uri: https://github.com/SanthaprakashMahendran/Landing-Zone.git
      ref: main
    contextDir: Openshift/sample-app
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: nodejs:latest   # pin a specific tag in prod, e.g. what `oc get bc landing-app -o yaml` shows today
  output:
    to:
      kind: ImageStreamTag
      name: landing-app:latest
  triggers:
    - type: ConfigChange    # build once when this BuildConfig is created/changed
    - type: ImageChange     # rebuild when the nodejs builder image is updated
      imageChange: {}
  runPolicy: Serial
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5